description: 'Marathon Health is a healthcare services company delivering advanced primary care and
  occupational health to employers, labor unions, health plans, and brokers/consultants. It operates
  onsite, nearsite, and network health centers plus virtual primary care, spanning preventive care,
  mental health, musculoskeletal treatment, lifestyle and medication management, value-driven referrals,
  and population health management to improve employee health outcomes while lowering total healthcare
  cost. Backed by NEA. As of this enrichment pass Marathon Health publishes no public developer API,
  developer portal, or event/webhook surface.'
